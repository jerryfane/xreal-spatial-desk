name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Pushing a tag like v0.1.0 also publishes XRealDesk.zip as a GitHub Release.
    tags: ['v*']

jobs:
  swift:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write  # only used by the release step on tag pushes
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --package-path app --build-tests
      # The GlassesLink tests start tools/fake_glasses.py (python3) on 127.0.0.1:52998/52999.
      - name: Test
        run: swift test --package-path app --skip-build
      - name: App bundle (universal)
        if: runner.os == 'macOS'
        run: |
          scripts/build-app.sh build -c release --arch arm64 --arch x86_64
          exe=build/XRealDesk.app/Contents/MacOS/XRealDesk
          archs=$(lipo -archs "$exe"); echo "architectures: $archs"
          [[ $archs == *arm64* && $archs == *x86_64* ]]
          plutil -lint build/XRealDesk.app/Contents/Info.plist
          codesign --verify --strict build/XRealDesk.app
          "$exe" --bad-option 2>&1 | grep -q 'XRealDesk \[--host'
          ditto -c -k --keepParent build/XRealDesk.app XRealDesk.zip
      - name: Upload app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: XRealDesk
          path: XRealDesk.zip
      - name: Release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" XRealDesk.zip --title "XRealDesk $GITHUB_REF_NAME" \
            --notes "Universal (Apple Silicon + Intel), macOS 14+. Ad-hoc signed, not notarized: see app/README.md › Download."
